name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm ci
        working-directory: ./awai-project

      - name: Lint
        run: npm run lint
        working-directory: ./awai-project

      - name: Test
        run: npm test
        working-directory: ./awai-project

      - name: Build
        run: npm run build
        working-directory: ./awai-project

